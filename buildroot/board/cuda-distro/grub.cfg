serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console
set default=0
set timeout=3
menuentry "CUDA Linux (read-only root)" {
    search --no-floppy --label --set=root cuda-rootfs
    linux /boot/bzImage root=PARTUUID=87d7c7b4-faf3-4ed8-928f-e41529ab9939 rootwait ro console=ttyS0,115200 console=tty1
}
