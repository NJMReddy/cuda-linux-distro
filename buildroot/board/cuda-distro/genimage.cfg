image efi.vfat {
  vfat {
    files = { "efi-part/EFI" }
  }
  size = 64M
}
image cuda-distro.img {
  hdimage { partition-table-type = "gpt" }
  partition esp {
    partition-type-uuid = U
    image = "efi.vfat"
    offset = 1M
  }
  partition rootfs {
    partition-type-uuid = L
    partition-uuid = "87d7c7b4-faf3-4ed8-928f-e41529ab9939"
    image = "rootfs.ext4"
  }
}
